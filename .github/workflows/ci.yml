# CI/CD: test → build image → deploy Railway.
# Deploy chỉ chạy khi push lên main VÀ cả test lẫn build đều xanh.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR mới đè PR cũ thì hủy lần chạy cũ; trên main thì không hủy giữa chừng
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bỏ test_cp5 (gọi vào bản deploy thật) và test_bonus_cicd (đọc badge của
      # chính workflow này). Test build Docker để job `build` lo.
      - name: Run tests
        run: pytest tests/ -v --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -m "not docker"

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t day12-agent:ci .

      - name: Check image size (< 500MB)
        run: |
          size=$(docker image inspect day12-agent:ci --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((500 * 1024 * 1024))

      # Chạy thử container: /health, /ready phải 200, /ask không key phải 401
      - name: Smoke test container
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy -e REDIS_URL=fake:// day12-agent:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/ready
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/ask \
            -H 'Content-Type: application/json' -d '{"question":"ci"}')
          test "$code" = 401

      - name: Container logs
        if: always()
        run: docker logs agent || true

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Project token của Railway, lưu trong GitHub Secrets — không bao giờ ghi vào file này
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: gallant-rejoicing
      PUBLIC_URL: https://gallant-rejoicing-production-2c9e.up.railway.app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check secret
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Thiếu secret RAILWAY_TOKEN (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.63.0

      - name: Deploy
        run: railway up --ci --service "$RAILWAY_SERVICE" --message "CI ${{ github.sha }}"

      - name: Smoke test deployment
        run: |
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/health")" = 200 ] && break
            sleep 10
          done
          curl -fsS "$PUBLIC_URL/health"
          curl -fsS "$PUBLIC_URL/ready"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$PUBLIC_URL/ask" \
            -H 'Content-Type: application/json' -d '{"question":"ci"}')
          test "$code" = 401
